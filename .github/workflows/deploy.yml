
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check UI and server access
        run: |
          node --check app.js
          node --check editor.js
          node scripts/smoke-ui.js
          php -l api/index.php
          php -l scripts/configure-admin.php
          python3 scripts/test-api.py

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /domains/dandomi.tech/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.research/**
            **/scripts/smoke-ui.js
            **/scripts/test-api.py
            **/scripts/build_research.py
            **/windows11x-private/**
            **/.env*
            **/README.md
