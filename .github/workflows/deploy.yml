
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check UI and server access
        run: |
          node --check app.js
          node --check editor.js
          node --check comments.js
          node --check ai.js
          node scripts/smoke-ui.js
          for file in api/*.php ai-context.php .well-known/*/*.php .well-known/*/api/*.php; do php -l "$file" || exit 1; done
          php -l scripts/configure-admin.php
          python3 scripts/test-api.py
          python3 scripts/test-mcp.py

      - name: Configure VPS SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "Add VPS_SSH_KEY and VPS_KNOWN_HOSTS in repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload code with restricted deployment account
        run: |
          # The SSH key is restricted by rrsync to the public code directory.
          # No root SSH, remote shell commands, deletion, or runtime data access.
          rsync -rltz --delay-updates --chmod=D750,F640 \
            --exclude='.git/' --exclude='.github/' --exclude='.research/' \
            --exclude='scripts/' --exclude='node_modules/' --exclude='.env*' \
            --exclude='windows11x-private/' --exclude='README.md' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            ./ windows11x-deploy@155.212.217.163:./

      - name: Verify published AI endpoints
        run: python3 scripts/check-live.py
